name: Materialise DBOS stage-one artefacts

on:
  push:
    branches:
      - develop/runtime-v0.2.0
    paths-ignore:
      - package-lock.json
      - packages/contracts/fixtures/**
      - packages/contracts/generated-manifest.json
      - packages/contracts/schemas/**
      - packages/contracts/src/generated/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: develop/runtime-v0.2.0
          fetch-depth: 0
      - name: Use authorised Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Verify bundled npm
        run: test "$(npm --version)" = "11.9.0"
      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate contract artefacts
        run: node tools/generate-contracts.mjs
      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/contracts/fixtures packages/contracts/generated-manifest.json packages/contracts/schemas packages/contracts/src/generated
          if git diff --cached --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git commit -m "Generate contract artefacts and lockfile"
          git push origin HEAD:develop/runtime-v0.2.0
