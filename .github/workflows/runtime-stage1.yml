name: DBOS runtime stage one

on:
  push:
    branches:
      - develop/runtime-v0.2.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use authorised Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Verify bundled npm
        run: test "$(npm --version)" = "11.9.0"
      - name: Clean install
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint and prohibited capabilities
        run: npm run lint
      - name: Check package boundaries
        run: npm run check:boundaries
      - name: Check deterministic generation
        run: npm run check:generated
      - name: Type-check and build
        run: npm run typecheck
      - name: Run automated tests
        run: npm test
      - name: Run conformance
        run: npm run conformance
      - name: Check traceability
        run: npm run check:traceability
      - name: Generate dependency inventory
        run: npm run dependency:inventory
      - name: Check licences
        run: npm run licence:check
      - name: Check vulnerabilities
        run: npm run vulnerability:check
      - name: Generate development manifest
        run: npm run release:manifest
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbos-runtime-stage1-evidence
          path: reports/
          if-no-files-found: warn
